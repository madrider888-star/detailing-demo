[project]
name = "ecodrive-bot"
version = "0.1.0"
description = "EcoDrive Auto — корпоративный Telegram-бот для обработки фотографий автомобилей"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.13,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "arq>=0.26",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pillow>=10.4",
    "boto3>=1.34",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.10",
    "boto3-stubs[s3]>=1.34",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "N", "C4", "PT"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках и комментариях — это нормально
    "S101",                        # assert в тестах
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PT011", "PT018", "E501"]
"scripts/*" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
exclude = ["alembic/versions", "\\.venv"]

[[tool.mypy.overrides]]
module = ["cv2.*", "arq.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
